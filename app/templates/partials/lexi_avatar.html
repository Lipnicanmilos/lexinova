{# Avatar Lexi (SVG) — stránka tútora aj nástenka. Štýly: static/css/lexi-avatar.css. #}
<svg viewBox="0 0 200 200" role="img" aria-label="Lexi">
    <defs>
        <linearGradient id="lexiFace" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#4079ff"/>
            <stop offset="1" stop-color="#2fd39a"/>
        </linearGradient>
    </defs>
    <circle class="halo" cx="100" cy="100" r="92"/>
    <!-- bob = pokojné pohupovanie, head = naklonenie podľa stavu a nálady -->
    <g class="bob"><g class="head">
        <circle cx="100" cy="104" r="74" fill="url(#lexiFace)"/>
        <!-- antenna -->
        <line x1="100" y1="30" x2="100" y2="14" class="antenna"/>
        <circle cx="100" cy="11" r="7" class="antenna-tip"/>
        <!-- face plate -->
        <rect x="50" y="68" width="100" height="72" rx="34" class="plate"/>
        <path d="M68 83 Q78 78 88 83" class="brow brow-l"/>
        <path d="M112 83 Q122 78 132 83" class="brow brow-r"/>
        <g class="eyes">
            <ellipse cx="78" cy="99" rx="9" ry="11" class="eye"/>
            <ellipse cx="122" cy="99" rx="9" ry="11" class="eye"/>
        </g>
        <ellipse cx="66" cy="120" rx="7" ry="4" class="cheek"/>
        <ellipse cx="134" cy="120" rx="7" ry="4" class="cheek"/>
        <path d="M88 121 Q100 131 112 121" class="smile"/>
        <ellipse cx="100" cy="124" rx="13" ry="4" class="mouth"/>
    </g></g>
</svg>
