    <style>
        body {
            font-family: 'Inter', sans-serif;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 1.5rem;
            overflow-x: hidden;
        }
        /* Počas učenia patrí celá plocha učeniu, ako na /ucenie. */
        body.lesson { display: block; padding: 0; }

        /* Obrazovka so zadaním témy */
        .topic-form { display: grid; gap: .85rem; margin-top: 1.4rem; }
        .topic-input {
            width: 100%; padding: .9rem 1rem; font-size: 1rem; font-family: inherit;
            border-radius: 14px; border: 1px solid var(--border);
            background: var(--surface-2); color: var(--text);
        }
        .topic-input:focus { outline: 2px solid var(--primary); outline-offset: 1px; }
        .topic-chips { display: flex; flex-wrap: wrap; gap: .4rem; }
        .topic-chip {
            padding: .4rem .7rem; border-radius: 999px; cursor: pointer;
            border: 1px solid var(--border); background: var(--surface-2); color: var(--muted);
            font-size: .8rem; font-weight: 600; font-family: inherit;
        }
        .topic-chip:hover { color: var(--primary-ink); border-color: var(--primary); }
        .pair-note { font-size: .8rem; color: var(--muted); }
        .topic-error { font-size: .85rem; color: var(--dont-ink); display: none; }
        .topic-error.show { display: block; }

        /* Stepper počas generovania */
        .gen-steps { display: grid; gap: .6rem; margin-top: 1.4rem; }
        .gen-step { display: flex; align-items: center; gap: .6rem; font-size: .92rem; color: var(--muted); }
        .gen-step .dot {
            width: 20px; height: 20px; border-radius: 50%; flex: 0 0 auto;
            border: 2px solid var(--border); display: inline-flex;
            align-items: center; justify-content: center; font-size: .7rem;
        }
        .gen-step.active { color: var(--text); font-weight: 700; }
        .gen-step.active .dot { border-color: var(--primary); border-top-color: transparent; animation: genSpin .8s linear infinite; }
        .gen-step.done .dot { border-color: var(--know); color: var(--know-ink); }
        .gen-step.done .dot::after { content: '✓'; }
        @keyframes genSpin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) { .gen-step.active .dot { animation: none; } }

        .theme-btn {
            padding: .3rem .5rem; border-radius: 10px; cursor: pointer; font-size: .9rem;
            background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
        }

        /* Card */
        .demo-card {
            width: 100%; max-width: 560px;
            background: var(--card);
            border-radius: 24px;
            box-shadow: var(--shadow);
            padding: 2rem;
            animation: cardPop .7s cubic-bezier(.2,.8,.2,1) forwards;
            opacity: 0;
        }
        @keyframes cardPop { to { opacity: 1; transform: translateY(0); } }

        /* Header row */
        .card-header {
            display: flex; justify-content: space-between;
            align-items: flex-start; margin-bottom: 1.4rem;
        }
        .demo-badge {
            display: inline-flex; align-items: center; gap: 6px;
            background: var(--surface-2);
            border: 1px solid var(--border); color: var(--primary-ink);
            font-size: .72rem; font-weight: 700; letter-spacing: .08em;
            text-transform: uppercase; padding: .32rem .85rem;
            border-radius: 50px;
        }
        .header-right { display: flex; align-items: center; gap: .5rem; }
        .lang-mini { display: flex; gap: 3px; }
        /* Server z tlačidiel robí odkazy (i18n_html), preto `[data-lang]`. */
        .lang-mini [data-lang] {
            padding: .22rem .55rem; border: 1px solid var(--border);
            background: var(--surface); border-radius: 6px; font-size: .72rem;
            font-weight: 700; cursor: pointer; color: var(--muted); transition: all .2s;
            text-decoration: none;
        }
        .lang-mini [data-lang].active { background: var(--primary); color: #fff; border-color: var(--primary); }
        .back-link {
            font-size: .83rem; color: var(--muted); text-decoration: none;
            display: flex; align-items: center; gap: 4px; transition: color .2s;
        }
        .back-link:hover { color: var(--primary-ink); }

        .demo-card h1 {
            text-align: center; font-size: 1.45rem; font-weight: 800;
            background: var(--grad-text); -webkit-background-clip: text;
            -webkit-text-fill-color: transparent; background-clip: text;
            margin-bottom: .35rem;
        }
        .subtitle { text-align: center; color: var(--muted); font-size: .88rem; }

        /* Učenie: čo ukážka hovorí navyše oproti /ucenie. Krížik je tlačidlo,
           nie odkaz, lebo vedie späť na zadanie témy v tej istej stránke. */
        button.learn-close { background: none; border: none; cursor: pointer; }
        .demo-stage { font-size: .82rem; font-weight: 600; color: var(--muted); }
        /* Zdroj sady — poctivá informácia, keď sada nie je čerstvo vygenerovaná */
        .source-note {
            padding: .6rem .8rem; border-radius: 12px;
            background: var(--surface); border: 1px solid var(--border);
            font-size: .8rem; color: var(--muted);
        }

        /* Koniec: h2, nie h1 — stránka má jediný h1, nadpis úvodnej obrazovky. */
        .learn-done h2 { font-size: 2.3rem; letter-spacing: -.02em; line-height: 1.1; }
        .demo-plan { font-size: .9rem; }
        .demo-more { display: flex; gap: .65rem 1rem; align-items: center; justify-content: center; flex-wrap: wrap; margin-top: .25rem; }
        .demo-more .app-btn { margin-top: 0; min-height: 0; }
        .cta-link { color: var(--text); font-size: .88rem; }

        @media (max-width: 480px) {
            body { padding: 1rem; }
            .demo-card { padding: 1.4rem; border-radius: 20px; }
        }
    </style>

<!-- Zadanie témy → generovanie (obrazovka, ktorou ukážka začína) -->
<div class="demo-card" id="topicScreen">
    <div class="card-header">
        <div id="topicBadge" class="demo-badge"></div>
        <div class="header-right">
            <div class="lang-mini">
                <button data-lang="en">EN</button>
                <button data-lang="sk">SK</button>
            </div>
            <button class="theme-btn" id="themeToggleTopic" title="Dark mode">🌙</button>
            <a href="/" class="back-link">←</a>
        </div>
    </div>

    <h1 id="topicTitle" data-en="What do you want to learn?" data-sk="Čo sa chceš naučiť?">Čo sa chceš naučiť?</h1>
    <p class="subtitle" id="topicSubtitle"
       data-en="Type a topic and AI prepares five words. Then you learn them the way the app teaches them. No account needed."

    <form class="topic-form" id="topicForm" onsubmit="return false;">
        <input class="topic-input" id="topicInput" maxlength="80" autocomplete="off">
        <div class="topic-chips" id="topicChips"></div>
        <div class="pair-note" id="pairNote"></div>
        <div class="topic-error" id="topicError"></div>
        <button class="app-btn primary lg block" id="btnGenerate" type="submit"></button>
    </form>

    <div class="gen-steps" id="genSteps" style="display:none;">
        <div class="gen-step" id="step1"><span class="dot"></span><span></span></div>
        <div class="gen-step" id="step2"><span class="dot"></span><span></span></div>

    </div>
</div>

<!-- Učenie: tá istá obrazovka ako /ucenie. Texty zo slovíčok skladá skript cez
     textContent, nie cez innerHTML — pochádzajú z AI. -->
<main class="learn" id="lessonScreen" hidden>

    <p class="demo-stage" id="stageNote"></p>

    <!-- Kartička: nové slovo. -->
    <section class="learn-view" id="cardView" hidden>
        <div class="flashcard learn-card" id="flashcard" role="button" tabindex="0">
            <div class="learn-word" id="cardWord"></div>
            <button type="button" class="learn-speak" id="cardSpeak">
                <i class="fa-solid fa-volume-high"></i>
            </button>
            <div class="learn-back" id="cardBack" hidden>

                <div class="learn-example" id="cardExample"></div>
                <div class="learn-example-tr" id="cardExampleTr"></div>
            </div>

        <div class="learn-answers" id="cardAnswers" hidden>

            <button type="button" class="app-btn primary lg" id="btnKnow"></button>

    <!-- Otázka: význam slova, doplnenie do vety alebo počúvanie. -->

    <!-- Koniec učenia -->

<script src="/static/js/speech.js?v={{ app_version }}"></script>
<script>
/* ── LABELS ── */
const LABELS = {
    en: {
        badge:      'Demo · no account',
        topicPlaceholder: 'e.g. ordering in a restaurant',
        topicChips: ['at the airport', 'job interview', 'at the doctor', 'small talk'],
        pairNote:   (from_, to) => `${from_} → ${to}`,
        generate:   'Generate my words',
        steps:      ['Reading the topic', 'Generating words', 'Getting the lesson ready'],
        errEmpty:   'Type a topic first — a word or two is enough.',
        errFailed:  'Generating failed. Try again, or a simpler topic.',
        srcCache:   'Someone asked for this topic before, so the words are ready right away.',
        srcSample:  (topic) => `We could not generate your topic (${topic}) just now, so here is a prepared set instead.`,
        close:      'Back to the topic',
        playWord:   'Play the word',
        play:       'Play',
        stageCard:  'New word',
        stageBack:  'The word comes back. In the app after a few days, here right away.',
        flipHint:   'Tap to see the translation',
        btnDont:    "Don't know",
        btnKnow:    'Know',
        next:       'Next',
        askChoice:  'What does it mean?',
        askCloze:   'Fill in the sentence',
        askListen:  'What do you hear?',
        askRecall:  'How do you say it?',
        doneTitle:  'Done',
        score:      (right, total) => `${right} of ${total} correct`,
        doneExplain: "In the app, what you knew comes back in a few days and what you didn't comes back tomorrow. You don't have to pick anything: the words that are due wait for you on the Today screen.",
        ctaPrimary: 'Create free account',
        donePlan:   "The demo is not saved. A free account gets AI 3× a day from a topic or a photo, and 5 sets of 30 words each. YouTube videos and no limits come with PLUS.",
        retry:      'Try another topic',
        loginLink:  'I have an account → Log in',
    },
    sk: {
        badge:      'Demo · bez účtu',
        topicPlaceholder: 'napr. objednávanie v reštaurácii',
        topicChips: ['na letisku', 'pracovný pohovor', 'u lekára', 'small talk'],
        pairNote:   (from_, to) => `${from_} → ${to}`,
        generate:   'Vygenerovať slová',
        steps:      ['Čítam tému', 'Generujem slovíčka', 'Pripravujem učenie'],
        errEmpty:   'Najprv napíš tému — stačí slovo či dve.',
        errFailed:  'Generovanie zlyhalo. Skús to znova, prípadne jednoduchšiu tému.',
        srcCache:   'Túto tému už niekto zadal, takže slová sú hotové hneď.',
        srcSample:  (topic) => `Tvoju tému (${topic}) sa teraz nepodarilo vygenerovať, preto ukazujeme pripravenú sadu.`,
        close:      'Späť na tému',
        playWord:   'Prehrať slovo',
        play:       'Prehrať',
        stageCard:  'Nové slovo',
        stageBack:  'Slovo sa vracia. V appke o pár dní, tu hneď.',
        flipHint:   'Klikni a ukáže sa preklad',
        btnDont:    'Neviem',
        btnKnow:    'Viem',
        next:       'Ďalej',
        askChoice:  'Čo to znamená?',
        askCloze:   'Doplň do vety',
        askListen:  'Čo počuješ?',
        askRecall:  'Ako sa to povie?',
        doneTitle:  'Hotovo',
        score:      (right, total) => `${right} z ${total} správne`,
        doneExplain: 'V appke sa to, čo si vedel, vráti až o pár dní, a to, čo nie, príde znova zajtra. Nemusíš nič vyberať: slová, ktoré sú na rade, ťa čakajú na obrazovke Dnes.',
        ctaPrimary: 'Vytvoriť bezplatný účet',
        donePlan:   'Ukážka sa neukladá. Účet zadarmo má AI 3× denne z témy aj z fotky a 5 sád po 30 slov. YouTube videá a žiadne limity sú v PLUS.',
        retry:      'Skúsiť inú tému',
        loginLink:  'Mám účet → Prihlásiť sa',
    },
};

/* ── JAZYKOVÁ DVOJICA ──
   Slovenské rozhranie sa učí angličtinu, anglické španielčinu — presne tie
   dvojice, pre ktoré má server pripravené náhradné sady. */
const PAIRS = {
    sk: { from: 'en', to: 'sk' },
    en: { from: 'es', to: 'en' },
};
const LANG_NAMES = {
    sk: { en: 'Angličtina', sk: 'slovenčina', es: 'Španielčina' },
    en: { en: 'English',    sk: 'Slovak',     es: 'Spanish' },
};

/* ── STATE ── */
// Jazyk urcuje URL (/ = sk, /en = en); localStorage je len zaloha pre appku.
let currentLang = window.__serverLang || localStorage.getItem('preferredLang') || 'en';
let generated = null;   // odpoveď servera: { topic, tasks, source, ... }
let items = [];
let idx = 0;
let rightCount = 0;
let wrongItems = [];
let answered = false;   // na aktuálnu otázku už padla odpoveď
let revealed = false;   // kartička je otočená

const $ = id => document.getElementById(id);

/* ── LANG ── */
function setLang(lang) {
    currentLang = lang;
    localStorage.setItem('preferredLang', lang);

    const L = LABELS[lang];
    $('topicBadge').textContent    = L.badge;
    $('topicInput').placeholder    = L.topicPlaceholder;
    $('btnGenerate').textContent   = L.generate;
    const pair = PAIRS[currentLang];
    $('pairNote').textContent =
        L.pairNote(LANG_NAMES[currentLang][pair.from], LANG_NAMES[currentLang][pair.to]);
    $('topicChips').innerHTML = L.topicChips
        .map(t => `<button type="button" class="topic-chip">${t}</button>`).join('');
    document.querySelectorAll('#topicChips .topic-chip').forEach(chip =>
        chip.addEventListener('click', () => {
            $('topicInput').value = chip.textContent;
            generateSet();
        }));
    L.steps.forEach((text, i) =>
        document.querySelector(`#step${i + 1} span:last-child`).textContent = text);

    // Učenie — prepínač jazyka je odkaz na druhú verziu stránky, tak stačí raz tu.
    $('closeBtn').setAttribute('aria-label', L.close);
    $('closeBtn').title = L.close;
    $('cardSpeak').setAttribute('aria-label', L.playWord);
    $('playLabel').textContent  = L.play;
    $('cardHint').textContent   = L.flipHint;
    $('btnDont').textContent    = L.btnDont;
    $('btnKnow').textContent    = L.btnKnow;
    $('btnNext').textContent    = L.next;
    $('doneTitle').textContent  = L.doneTitle;
    $('doneExplain').textContent = L.doneExplain;
    $('ctaPrimary').textContent = L.ctaPrimary;
    $('donePlan').textContent   = L.donePlan;
    $('ctaRetry').textContent   = L.retry;
    $('ctaLogin').textContent   = L.loginLink;
}

/* ── GENEROVANIE ──
   Server vracia slová k téme a úlohy z nich. Zlyhanie ani vyčerpaný denný strop
   nie sú pre návštevníka slepá ulička — dostane pripravenú sadu a `source` povie,
   čo sa stalo, aby to ukážka nezamlčala. */
async function generateSet() {
    const L = LABELS[currentLang];
    const topic = $('topicInput').value.trim();
    const err = $('topicError');
    if (topic.length < 2) {
        err.textContent = L.errEmpty;
        err.classList.add('show');
        return;
    }
    err.classList.remove('show');
    setGenerating(true);

    const pair = PAIRS[currentLang];
    try {
        const res = await fetch('/api/v1/demo/generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ topic, language_from: pair.from, language_to: pair.to }),
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        generated = await res.json();
    } catch (e) {
        console.error(e);
        setGenerating(false);
        err.textContent = L.errFailed;
        err.classList.add('show');
        return;
    }

    markStep(3, 'done');
    window.lexiTrack && window.lexiTrack('Demo sada vygenerovana', { zdroj: generated.source });
    startDemo();
}

function setGenerating(on) {
    $('topicForm').style.display = on ? 'none' : 'grid';
    $('genSteps').style.display  = on ? 'grid' : 'none';
    if (!on) return;
    // Kroky bežia na čas — server medzikroky nehlási, ale návštevník má vidieť,
    // že sa niečo deje.
    ['step1','step2','step3'].forEach(id => $(id).className = 'gen-step');
    markStep(1, 'active');
    setTimeout(() => { markStep(1, 'done'); markStep(2, 'active'); }, 900);
    setTimeout(() => { markStep(2, 'done'); markStep(3, 'active'); }, 2600);
}

function markStep(n, state) {
    const el = $('step' + n);
    if (el) el.className = 'gen-step ' + state;
}

/* ── UČENIE ──
   Obrazovky a správanie sú z `page-learn.js`, len odpovede sa nikam nezapisujú:
   ukážka nemá účet, ku ktorému by patrili. */
function speak(text, item) {
    if (LexiSpeech.available) LexiSpeech.speak(text, LexiSpeech.toLocale(item.language_from, 'en-US'));
}

function showScreen(lesson) {
    $('topicScreen').hidden = lesson;
    $('lessonScreen').hidden = !lesson;
    document.body.classList.toggle('lesson', lesson);
}

function showView(id) {
    ['cardView', 'questionView', 'doneView'].forEach(view => { $(view).hidden = view !== id; });
    const done = id === 'doneView';
    $('learnTop').hidden = done;
    $('stageNote').hidden = done;
    if (done) $('sourceNote').hidden = true;
}

function startDemo() {
    items = generated.tasks;
    idx = 0; rightCount = 0; wrongItems = [];

    const L = LABELS[currentLang];
    const note = $('sourceNote');
    note.hidden = generated.source === 'ai';
    if (generated.source === 'cache') note.textContent = L.srcCache;
    else if (generated.source === 'sample') note.textContent = L.srcSample(generated.requested_topic);

    showScreen(true);
    showItem();
}

function showItem() {
    answered = false;
    revealed = false;
    $('learnFill').style.width = `${Math.round(idx / items.length * 100)}%`;
    $('learnCount').textContent = `${idx + 1} / ${items.length}`;
    const item = items[idx];
    $('stageNote').textContent = LABELS[currentLang][item.exercise === 'card' ? 'stageCard' : 'stageBack'];
    if (item.exercise === 'card') showCard(item);
    else showQuestion(item);
}

function showCard(item) {
    $('cardWord').textContent = item.original_word;
    $('cardTranslation').textContent = item.translation;
    $('cardExample').textContent = item.example_sentence || '';
    $('cardExampleTr').textContent = item.example_translation || '';
    $('cardBack').hidden = true;
    $('cardHint').hidden = false;
    $('cardAnswers').hidden = true;
    $('cardSpeak').hidden = !LexiSpeech.available;
    $('flashcard').classList.remove('flipped');
    showView('cardView');
    speak(item.original_word, item);
}

function revealCard() {
    if (revealed || items[idx]?.exercise !== 'card') return;
    revealed = true;
    $('cardBack').hidden = false;
    $('cardHint').hidden = true;
    $('cardAnswers').hidden = false;
    $('flashcard').classList.add('flipped');
}

/* Počúvanie bez hlasu v prehliadači nejde; namiesto neho sa ukáže preklad a
   hľadá sa to isté slovo medzi tými istými možnosťami. */
function showQuestion(item) {
    const L = LABELS[currentLang];
    const listen = item.exercise === 'listen' && LexiSpeech.available;
    const recall = item.exercise === 'listen' && !LexiSpeech.available;
    const cloze = item.exercise === 'cloze';

    $('questionAsk').textContent = cloze ? L.askCloze : listen ? L.askListen : recall ? L.askRecall : L.askChoice;
    $('questionPlay').hidden = !listen;
    $('questionPrompt').hidden = listen;
    $('questionFeedback').hidden = true;
    $('btnNext').hidden = true;

    const main = $('promptMain');
    if (cloze) {
        const gap = document.createElement('span');
        gap.className = 'learn-gap';
        gap.id = 'clozeGap';
        main.replaceChildren(document.createTextNode(item.sentence_before || ''), gap,
                             document.createTextNode(item.sentence_after || ''));
    } else {
        main.textContent = recall ? item.translation : item.original_word;
    }
    $('promptSub').textContent = cloze ? (item.sentence_translation || '') : '';

    $('questionOptions').replaceChildren(...item.options.map((option, i) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'learn-option';
        btn.textContent = option;
        btn.addEventListener('click', () => chooseOption(i));
        return btn;
    }));
    showView('questionView');
    if (listen) speak(item.original_word, item);
}

function chooseOption(i) {
    const item = items[idx];
    if (answered || !item || i < 0 || i >= item.options.length) return;
    answered = true;
    const correct = item.options[i] === item.answer;

    document.querySelectorAll('#questionOptions .learn-option').forEach((btn, n) => {
        btn.disabled = true;
        if (item.options[n] === item.answer) btn.classList.add('right');
        else if (n === i) btn.classList.add('wrong');
    });
    if (item.exercise === 'cloze') {
        const gap = $('clozeGap');
        gap.textContent = item.sentence_hidden;
        gap.classList.add('filled');
        speak(item.sentence_before + item.sentence_hidden + item.sentence_after, item);
    }
    const feedback = $('questionFeedback');
    feedback.textContent = `${item.original_word} — ${item.translation}`;
    feedback.hidden = false;
    recordAnswer(item, correct);
    $('btnNext').hidden = false;
    $('btnNext').focus();
}

/* Na rozdiel od /ucenie sa slovo v ukážke objaví dvakrát, ale do zoznamu
   „toto ti nešlo" patrí raz. */
function recordAnswer(item, correct) {
    if (correct) rightCount++;
    else if (!wrongItems.some(w => w.id === item.id)) wrongItems.push(item);
}

function nextItem() {
    idx++;
    if (idx >= items.length) finish();
    else showItem();
}

function answerCard(correct) {
    if (!revealed || answered) return;
    answered = true;
    recordAnswer(items[idx], correct);
    nextItem();
}

function finish() {
    $('doneScore').textContent = LABELS[currentLang].score(rightCount, items.length);
    $('doneWrong').replaceChildren(...wrongItems.map(item => {
        const li = document.createElement('li');
        const word = document.createElement('b');
        word.textContent = item.original_word;
        li.append(word, document.createTextNode(` — ${item.translation}`));
        return li;
    }));
    $('doneWrong').hidden = !wrongItems.length;
    showView('doneView');
}

/* Späť na zadanie témy — druhá téma je presne to, čo má návštevník po prvej sade
   chuť skúsiť, a cache to väčšinou nič nestojí. */
function restartDemo() {
    if (LexiSpeech.available) LexiSpeech.cancel();
    items = [];
    showScreen(false);
    setGenerating(false);
    $('topicInput').value = '';
    $('topicInput').focus();
}

/* ── TMAVÝ REŽIM ── */
function toggleTheme() {
    const dark = document.documentElement.getAttribute('data-theme') === 'dark';
    if (dark) { document.documentElement.removeAttribute('data-theme'); localStorage.setItem('darkMode', 'false'); }
    else { document.documentElement.setAttribute('data-theme', 'dark'); localStorage.setItem('darkMode', 'true'); }
}

/* ── INIT ── */
$('themeToggleTopic').addEventListener('click', toggleTheme);
$('topicForm').addEventListener('submit', generateSet);
$('closeBtn').addEventListener('click', restartDemo);
$('ctaRetry').addEventListener('click', restartDemo);
$('flashcard').addEventListener('click', revealCard);
$('cardSpeak').addEventListener('click', e => {
    e.stopPropagation();
    speak(items[idx].original_word, items[idx]);
});
$('btnKnow').addEventListener('click', () => answerCard(true));
$('btnDont').addEventListener('click', () => answerCard(false));
$('btnNext').addEventListener('click', nextItem);
$('questionPlay').addEventListener('click', () => speak(items[idx].original_word, items[idx]));

document.addEventListener('keydown', e => {
    const item = items[idx];
    if (!item || e.ctrlKey || e.metaKey || e.altKey) return;
    if (item.exercise === 'card') {
        if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); revealCard(); }
        else if (e.key === '1') answerCard(false);
        else if (e.key === '2') answerCard(true);
        return;
    }
    if (/^[1-9]$/.test(e.key)) chooseOption(Number(e.key) - 1);
    // Enter na zaostrenom „Ďalej" rieši prehliadač, inak by preskočil dve úlohy.
    else if (e.key === 'Enter' && answered && e.target.id !== 'btnNext') nextItem();
});

setLang(currentLang);
$('topicInput').focus();
</script>
<script src="/static/js/cookie-notice.js?v={{ app_version }}"></script>
</body>
</html>
