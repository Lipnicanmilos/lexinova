    <style>
        

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 1.5rem;
            overflow-x: hidden;
        }


        /* Obrazovka so zadaním témy */
        .topic-form { display: grid; gap: .85rem; margin-top: 1.4rem; }
        .topic-input {
            width: 100%; padding: .9rem 1rem; font-size: 1rem; font-family: inherit;
            border-radius: 14px; border: 1px solid var(--border);
            background: var(--bg); color: var(--text);
        }
        .topic-input:focus { outline: 2px solid var(--primary); outline-offset: 1px; }
        .topic-chips { display: flex; flex-wrap: wrap; gap: .4rem; }
        .topic-chip {
            padding: .4rem .7rem; border-radius: 999px; cursor: pointer;
            border: 1px solid var(--border); background: var(--bg); color: var(--muted);
            font-size: .8rem; font-weight: 600; font-family: inherit;
        }
        .topic-chip:hover { color: var(--primary); border-color: var(--primary); }
        .pair-note { font-size: .8rem; color: var(--muted); }
        .topic-error { font-size: .85rem; color: #e53e3e; display: none; }
        .topic-error.show { display: block; }

        /* Stepper počas generovania — rovnaké kroky ako AI modál v appke,
           aby ukážka a produkt vyzerali ako jedna vec. */
        .gen-steps { display: grid; gap: .6rem; margin-top: 1.4rem; }
        .gen-step { display: flex; align-items: center; gap: .6rem; font-size: .92rem; color: var(--muted); }
        .gen-step .dot {
            width: 20px; height: 20px; border-radius: 50%; flex: 0 0 auto;
            border: 2px solid var(--border); display: inline-flex;
            align-items: center; justify-content: center; font-size: .7rem;
        }
        .gen-step.active { color: var(--text); font-weight: 700; }
        .gen-step.active .dot { border-color: var(--primary); border-top-color: transparent; animation: genSpin .8s linear infinite; }
        .gen-step.done .dot { border-color: #2f855a; color: #2f855a; }
        .gen-step.done .dot::after { content: '✓'; }
        @keyframes genSpin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) { .gen-step.active .dot { animation: none; } }

        /* Zdroj sady — poctivá informácia, keď sada nie je čerstvo vygenerovaná */
        .source-note {
            margin-top: .9rem; padding: .6rem .8rem; border-radius: 12px;
            background: var(--bg); border: 1px solid var(--border);
            font-size: .8rem; color: var(--muted); display: none;
        }
        .source-note.show { display: block; }

        .theme-btn {
            padding: .3rem .5rem; border-radius: 10px; cursor: pointer; font-size: .9rem;
            background: var(--bg); color: var(--text); border: 1px solid var(--border);
        }

        /* Card */
        .demo-card {
            width: 100%; max-width: 560px;
            background: var(--card);
            border-radius: 24px;
            box-shadow: var(--shadow);
            padding: 2rem;
            animation: cardPop .7s cubic-bezier(.2,.8,.2,1) forwards;
            opacity: 0;
        }
        @keyframes cardPop { to { opacity: 1; transform: translateY(0); } }

        /* Header row */
        .card-header {
            display: flex; justify-content: space-between;
            align-items: flex-start; margin-bottom: 1.4rem;
        }
        .demo-badge {
            display: inline-flex; align-items: center; gap: 6px;
            background: linear-gradient(135deg,#4079ff12,#40ffaa12);
            border: 1px solid #4079ff28; color: var(--primary);
            font-size: .72rem; font-weight: 700; letter-spacing: .08em;
            text-transform: uppercase; padding: .32rem .85rem;
            border-radius: 50px;
        }
        .header-right { display: flex; align-items: center; gap: .5rem; }
        .lang-mini { display: flex; gap: 3px; }
        .lang-mini button {
            padding: .22rem .55rem; border: 1px solid var(--border);
            background: #fff; border-radius: 6px; font-size: .72rem;
            font-weight: 700; cursor: pointer; color: var(--muted); transition: all .2s;
        }
        .lang-mini button.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        .back-link {
            font-size: .83rem; color: var(--muted); text-decoration: none;
            display: flex; align-items: center; gap: 4px; transition: color .2s;
        }
        .back-link:hover { color: var(--primary); }

        h1, .screen-title {
            text-align: center; font-size: 1.45rem; font-weight: 800;
            background: var(--grad); -webkit-background-clip: text;
            -webkit-text-fill-color: transparent; background-clip: text;
            margin-bottom: .35rem;
        }
        .subtitle { text-align: center; color: var(--muted); font-size: .88rem; margin-bottom: 1.4rem; }

        /* Progress */
        .progress-wrap { margin-bottom: 1.4rem; }
        .progress-label {
            display: flex; justify-content: space-between;
            font-size: .78rem; color: var(--muted); margin-bottom: .35rem;
        }
        .progress-bar-bg { height: 6px; background: var(--border); border-radius: 50px; overflow: hidden; }
        .progress-bar-fill {
            height: 100%; background: var(--grad);
            border-radius: 50px; transition: width .4s ease; width: 0%;
        }

        /* Flashcard */
        .flashcard {
            background: #f8faff; border: 2px solid var(--border);
            border-radius: 20px; padding: 2.5rem 2rem;
            text-align: center; min-height: 210px;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            cursor: pointer; transition: all .3s ease;
            position: relative; user-select: none;
        }
        .flashcard:hover { border-color: var(--primary); transform: translateY(-2px); }
        .flashcard.flipped { border-color: var(--primary); background: linear-gradient(135deg,#f0f4ff,#f0fff8); }

        .word-lang { font-size: .72rem; color: var(--muted); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; margin-bottom: .55rem; }
        .word-main { font-size: 2.2rem; font-weight: 800; color: var(--primary); line-height: 1.2; display: flex; align-items: center; gap: .65rem; }
        .speak-btn { font-size: 1.4rem; cursor: pointer; background: none; border: none; line-height: 1; padding: 0; transition: transform .2s; }
        .speak-btn:hover { transform: scale(1.15); }

        .translation-block { margin-top: 1.1rem; padding-top: 1.1rem; border-top: 1px solid var(--border); width: 100%; }
        .translation-lang { font-size: .72rem; color: var(--muted); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; margin-bottom: .35rem; }
        .word-translation { font-size: 1.8rem; font-weight: 700; color: var(--text); display: flex; align-items: center; justify-content: center; gap: .55rem; }

        .flip-hint { color: var(--muted); font-size: .8rem; margin-top: 1.1rem; display: flex; align-items: center; gap: 5px; }

        /* Action buttons */
        .action-buttons { display: flex; gap: .7rem; margin-top: 1.1rem; }
        .action-btn {
            flex: 1; padding: .9rem; border: none; border-radius: 14px;
            font-size: .95rem; font-weight: 700; cursor: pointer;
            transition: all .2s ease; display: flex;
            align-items: center; justify-content: center; gap: 6px;
            opacity: 0; transform: translateY(8px);
        }
        .action-btn.visible { opacity: 1; transform: translateY(0); transition: opacity .3s, transform .3s, background .2s; }
        .btn-dont { background: #fff1f0; color: #c62828; border: 2px solid #ffcdd2; }
        .btn-dont:hover { background: #ffebee; border-color: #ef9a9a; transform: translateY(-2px); }
        .btn-know { background: #f1f8e9; color: #2e7d32; border: 2px solid #c8e6c9; }
        .btn-know:hover { background: #e8f5e9; border-color: #a5d6a7; transform: translateY(-2px); }

        /* Results */
        .results-screen { display: none; text-align: center; padding: .5rem 0; animation: cardPop .6s cubic-bezier(.2,.8,.2,1) forwards; }
        .score-circle {
            width: 110px; height: 110px; border-radius: 50%;
            background: var(--grad); display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            margin: 0 auto 1.4rem; box-shadow: 0 8px 20px rgba(64,121,255,.3);
        }
        .score-pct { font-size: 1.8rem; font-weight: 800; color: #fff; line-height: 1; }
        .score-lbl { font-size: .68rem; color: rgba(255,255,255,.85); font-weight: 700; }
        .result-title { font-size: 1.45rem; font-weight: 800; margin-bottom: .45rem; }
        .result-msg { color: var(--muted); font-size: .88rem; margin-bottom: 1.6rem; line-height: 1.6; }
        .result-stats { display: flex; gap: .65rem; justify-content: center; margin-bottom: 1.6rem; }
        .stat-chip { padding: .45rem .95rem; border-radius: 50px; font-size: .83rem; font-weight: 700; }
        .stat-know { background: #f1f8e9; color: #2e7d32; }
        .stat-dont { background: #fff1f0; color: #c62828; }

        .cta-primary {
            display: block; width: 100%; padding: 1rem;
            background: var(--grad); color: #fff;
            font-size: .98rem; font-weight: 700; border: none;
            border-radius: 14px; cursor: pointer; text-decoration: none;
            text-align: center; transition: all .25s;
            margin-bottom: .7rem; box-shadow: 0 4px 15px rgba(64,121,255,.35);
        }
        .cta-primary:hover { transform: translateY(-2px); box-shadow: 0 7px 22px rgba(64,121,255,.45); }

        .cta-secondary-row {
            display: flex; gap: .65rem; justify-content: center;
            align-items: center; flex-wrap: wrap;
        }
        .cta-link { color: var(--muted); font-size: .88rem; text-decoration: none; transition: color .2s; }
        .cta-link:hover { color: var(--primary); }
        .cta-retry {
            background: none; border: 2px solid var(--border); color: var(--muted);
            padding: .45rem .95rem; border-radius: 10px;
            font-size: .83rem; font-weight: 700; cursor: pointer; transition: all .2s;
        }
        .cta-retry:hover { border-color: var(--primary); color: var(--primary); }

        .ai-teaser {
            margin-top: 1.4rem; padding: .9rem 1rem;
            background: linear-gradient(135deg,#f0f4ff,#f0fff8);
            border-radius: 12px; border: 1px solid #c7d8ff;
            font-size: .83rem; color: var(--primary); font-weight: 600;
            text-align: left; display: flex; gap: 9px; align-items: flex-start;
        }
        .ai-icon { font-size: 1.25rem; flex-shrink: 0; }

        @media (max-width: 480px) {
            body { padding: 1rem; }
            .demo-card { padding: 1.4rem; border-radius: 20px; }
            .word-main { font-size: 1.75rem; }
            .word-translation { font-size: 1.5rem; }
            .flashcard { padding: 2rem 1.25rem; min-height: 185px; }
        }
    </style>

{% include "partials/app_version.html" %}
</head>
<body>


<div class="demo-card">

    <!-- Zadanie témy → generovanie (obrazovka, ktorou ukážka začína) -->
    <div id="topicScreen">
        <div class="card-header">
            <div id="topicBadge" class="demo-badge"></div>
            <div class="header-right">
                <div class="lang-mini">
                    <button data-lang="en">EN</button>
                    <button data-lang="sk">SK</button>
                </div>
                <button class="theme-btn" id="themeToggleTopic" title="Dark mode">🌙</button>
                <a href="/" class="back-link">←</a>
            </div>
        </div>

        <h1 id="topicTitle"></h1>
        <p class="subtitle" id="topicSubtitle"></p>

        <form class="topic-form" id="topicForm" onsubmit="return false;">
            <input class="topic-input" id="topicInput" maxlength="80" autocomplete="off">
            <div class="topic-chips" id="topicChips"></div>
            <div class="pair-note" id="pairNote"></div>
            <div class="topic-error" id="topicError"></div>
            <button class="cta-primary" id="btnGenerate" type="submit"></button>
        </form>

        <div class="gen-steps" id="genSteps" style="display:none;">
            <div class="gen-step" id="step1"><span class="dot"></span><span></span></div>
            <div class="gen-step" id="step2"><span class="dot"></span><span></span></div>
            <div class="gen-step" id="step3"><span class="dot"></span><span></span></div>
        </div>
    </div>

    <!-- Test screen -->
    <div id="testScreen" style="display:none;">
        <div class="card-header">
            <div id="demoBadge" class="demo-badge"></div>
            <div class="header-right">
                <div class="lang-mini">
                    <button data-lang="en">EN</button>
                    <button data-lang="sk">SK</button>
                </div>
                <button class="theme-btn" id="themeToggle" title="Dark mode">🌙</button>
                <a href="/" class="back-link" id="backLink">←</a>
            </div>
        </div>

        <!-- h2, nie h1: stránka má jediný h1 a je ním nadpis úvodnej obrazovky,
             ktorá sa vykreslí ako prvá. Dva h1 v DOM hlásil test SEO. -->
        <h2 class="screen-title" id="demoTitle" data-en="Try LexiNova" data-sk="Vyskúšaj LexiNova">Vyskúšaj LexiNova</h2>
        <p class="subtitle" id="demoSubtitle" data-en="Spanish words · click the card to reveal the translation" data-sk="Španielske slovíčka · klikni na kartičku a zobraz preklad">Španielske slovíčka · klikni na kartičku a zobraz preklad</p>

        <div class="progress-wrap">
            <div class="progress-label">
                <span id="progressText"></span>
                <span id="scoreText"></span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressFill"></div>
            </div>
        </div>

        <div class="source-note" id="sourceNote"></div>

        <div class="flashcard" id="flashcard" onclick="flipCard()">
            <div class="word-lang" id="wordLang"></div>
            <div class="word-main">
                <span id="wordText"></span>
                <button class="speak-btn" onclick="speakWord(event)">🔊</button>
            </div>
            <div id="translationBlock" class="translation-block" style="display:none;">
                <div class="translation-lang" id="transLang"></div>
                <div class="word-translation">
                    <span id="translationText"></span>
                    <button class="speak-btn" onclick="speakTranslation(event)">🔊</button>
                </div>
            </div>
            <div class="flip-hint" id="flipHint"></div>
        </div>

        <div class="action-buttons">
            <button class="action-btn btn-dont" id="btnDont" onclick="answer(false)"></button>
            <button class="action-btn btn-know" id="btnKnow" onclick="answer(true)"></button>
        </div>
    </div>

    <!-- Results screen -->
    <div class="results-screen" id="resultsScreen">
        <div class="score-circle">
            <div class="score-pct" id="scorePct">--%</div>
            <div class="score-lbl" id="scoreLbl"></div>
        </div>

        <div class="result-title" id="resultTitle"></div>
        <p class="result-msg" id="resultMsg"></p>

        <div class="result-stats">
            <div class="stat-chip stat-know" id="statKnow"></div>
            <div class="stat-chip stat-dont" id="statDont"></div>
        </div>

        <a href="/register" class="cta-primary" id="ctaPrimary"></a>

        <div class="cta-secondary-row">
            <button class="cta-retry" onclick="restartDemo()" id="ctaRetry"></button>
            <a href="/login" class="cta-link" id="ctaLogin"></a>
        </div>

        <div class="ai-teaser">
            <span class="ai-icon">🤖</span>
            <span id="aiTeaser"></span>
        </div>
    </div>

</div>

<script src="/static/js/speech.js?v={{ app_version }}"></script>

        retry:      '🔁 Skúsiť znova',
        loginLink:  'Mám účet → Prihlásiť sa',
        aiTeaser:   'S účtom si vytvoríš vlastnú sadu slovíčok pomocou AI — z témy, z fotky učebnice alebo aj z YouTube videa. Zvyšok spraví LexiNova za teba.',
    },
};

/* ── JAZYKOVÁ DVOJICA ──
   Slovenské rozhranie sa učí angličtinu, anglické španielčinu — presne tie
   dvojice, pre ktoré má server pripravené náhradné sady. */
const PAIRS = {
    sk: { from: 'en', to: 'sk' },
    en: { from: 'es', to: 'en' },
};
const LANG_NAMES = {
    sk: { en: 'angličtina', sk: 'slovenčina', es: 'španielčina' },
    en: { en: 'English',    sk: 'Slovak',     es: 'Spanish' },
};
// Locale pre čítanie nahlas — bez neho by prehliadač čítal slovenčinu
// anglickým hlasom (rovnaká pasca, akú rieši speech.js v appke).
const SPEECH_LOCALE = { en: 'en-US', sk: 'sk-SK', es: 'es-ES' };

/* ── STATE ── */
// Jazyk urcuje URL (/ = sk, /en = en); localStorage je len zaloha pre appku.
let currentLang = window.__serverLang || localStorage.getItem('preferredLang') || 'en';
let words = [];
let generated = null;   // odpoveď servera: { topic, words, source, ... }
let currentIndex = 0;
let scoreKnow = 0;
let scoreDont = 0;
let isFlipped = false;

/* ── LANG ── */
function setLang(lang) {
    currentLang = lang;
    localStorage.setItem('preferredLang', lang);

    document.querySelectorAll('.lang-mini button').forEach(b =>
        b.classList.toggle('active', b.getAttribute('data-lang') === lang));

    const L = LABELS[lang];
    document.getElementById('demoBadge').textContent   = L.badge;
    document.getElementById('backLink').textContent    = L.back;
    document.getElementById('demoTitle').textContent   = L.title;
    document.getElementById('demoSubtitle').textContent = L.subtitle;
    document.getElementById('wordLang').textContent    = L.wordLang;
    document.getElementById('transLang').textContent   = L.transLang;
    document.getElementById('flipHint').textContent    = L.flipHint;
    document.getElementById('btnDont').textContent     = L.btnDont;
    document.getElementById('btnKnow').textContent     = L.btnKnow;
    document.getElementById('scoreLbl').textContent    = L.scoreLbl;
    document.getElementById('ctaPrimary').textContent  = L.ctaPrimary;
    document.getElementById('ctaRetry').textContent    = L.retry;
    document.getElementById('ctaLogin').textContent    = L.loginLink;
    document.getElementById('aiTeaser').textContent    = L.aiTeaser;

    // Obrazovka so zadaním témy
    document.getElementById('topicBadge').textContent    = L.badge;
    document.getElementById('topicTitle').textContent    = L.topicTitle;
    document.getElementById('topicSubtitle').textContent = L.topicSubtitle;
    document.getElementById('topicInput').placeholder    = L.topicPlaceholder;
    document.getElementById('btnGenerate').textContent   = L.generate;
    const pair = PAIRS[currentLang];
    document.getElementById('pairNote').textContent =
        L.pairNote(LANG_NAMES[currentLang][pair.from], LANG_NAMES[currentLang][pair.to]);
    document.getElementById('topicChips').innerHTML = L.topicChips
        .map(t => `<button type="button" class="topic-chip">${t}</button>`).join('');
    document.querySelectorAll('#topicChips .topic-chip').forEach(chip =>
        chip.addEventListener('click', () => {
            document.getElementById('topicInput').value = chip.textContent;
            generateSet();
        }));
    L.steps.forEach((text, i) =>
        document.querySelector(`#step${i + 1} span:last-child`).textContent = text);

    // Update live progress text if game is running
    if (words.length) updateProgressUI();
}

/* ── HELPERS ── */
function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function updateProgressUI() {
    const L = LABELS[currentLang];
    const total = words.length;
    document.getElementById('progressText').textContent = L.wordNum(currentIndex + 1, total);
    document.getElementById('scoreText').innerHTML = L.scoreStr(scoreKnow, scoreDont);
    document.getElementById('progressFill').style.width = `${(currentIndex / total) * 100}%`;
}

/* ── GENEROVANIE ──
   Server vracia päť slovíčok k téme. Zlyhanie ani vyčerpaný denný strop nie sú
   pre návštevníka slepá ulička — dostane pripravenú sadu a `source` povie, čo
   sa stalo, aby to ukážka nezamlčala. */
async function generateSet() {
    const L = LABELS[currentLang];
    const topic = document.getElementById('topicInput').value.trim();
    const err = document.getElementById('topicError');
    if (topic.length < 2) {
        err.textContent = L.errEmpty;
        err.classList.add('show');
        return;
    }
    err.classList.remove('show');
    setGenerating(true);

    const pair = PAIRS[currentLang];
    try {
        const res = await fetch('/api/v1/demo/generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ topic, language_from: pair.from, language_to: pair.to }),
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        generated = await res.json();
    } catch (e) {
        console.error(e);
        setGenerating(false);
        err.textContent = L.errFailed;
        err.classList.add('show');
        return;
    }

    markStep(3, 'done');
    window.lexiTrack && window.lexiTrack('Demo sada vygenerovana', { zdroj: generated.source });
    startDemo();
}

function setGenerating(on) {
    document.getElementById('topicForm').style.display = on ? 'none' : 'grid';
    document.getElementById('genSteps').style.display  = on ? 'grid' : 'none';
    if (!on) return;
    // Kroky bežia na čas — server medzikroky nehlási, ale návštevník má vidieť,
    // že sa niečo deje (rovnaký princíp ako AI modál v appke).
    ['step1','step2','step3'].forEach(id => document.getElementById(id).className = 'gen-step');
    markStep(1, 'active');
    setTimeout(() => { markStep(1, 'done'); markStep(2, 'active'); }, 900);
    setTimeout(() => { markStep(2, 'done'); markStep(3, 'active'); }, 2600);
}

function markStep(n, state) {
    const el = document.getElementById('step' + n);
    if (el) el.className = 'gen-step ' + state;
}

/* ── DEMO FLOW ── */
function startDemo() {
    words = shuffle(generated.words);
    currentIndex = 0; scoreKnow = 0; scoreDont = 0; isFlipped = false;
    document.getElementById('topicScreen').style.display = 'none';
    document.getElementById('testScreen').style.display = 'block';
    document.getElementById('resultsScreen').style.display = 'none';
    document.getElementById('resultsScreen').className = 'results-screen';

    const L = LABELS[currentLang];
    document.getElementById('demoSubtitle').textContent =
        `${generated.category_name || generated.topic} · ${L.subtitle}`;

    const note = document.getElementById('sourceNote');
    if (generated.source === 'cache') { note.textContent = L.srcCache; note.classList.add('show'); }
    else if (generated.source === 'sample') { note.textContent = L.srcSample(generated.requested_topic); note.classList.add('show'); }
    else note.classList.remove('show');

    showCard();
}

function showCard() {
    isFlipped = false;
    const word = words[currentIndex];
    document.getElementById('wordText').textContent = word.original;
    document.getElementById('translationText').textContent = word.translation;
    document.getElementById('translationBlock').style.display = 'none';
    document.getElementById('flipHint').style.display = 'flex';
    document.getElementById('flashcard').classList.remove('flipped');

    ['btnDont', 'btnKnow'].forEach(id => document.getElementById(id).classList.remove('visible'));
    updateProgressUI();
}

function flipCard() {
    if (isFlipped) return;
    isFlipped = true;
    document.getElementById('flashcard').classList.add('flipped');
    document.getElementById('translationBlock').style.display = 'block';
    document.getElementById('flipHint').style.display = 'none';
    setTimeout(() => ['btnDont', 'btnKnow'].forEach(id =>
        document.getElementById(id).classList.add('visible')), 150);
}

function answer(know) {
    if (!isFlipped) return;
    if (know) scoreKnow++; else scoreDont++;
    currentIndex++;
    if (currentIndex >= words.length) showResults(); else showCard();
}

function showResults() {
    document.getElementById('testScreen').style.display = 'none';
    const el = document.getElementById('resultsScreen');
    el.style.display = 'block';

    const total = words.length;
    const pct = Math.round((scoreKnow / total) * 100);
    const L = LABELS[currentLang];
    const tier = pct >= 90 ? 'high' : pct >= 60 ? 'mid' : 'low';

    document.getElementById('scorePct').textContent = pct + '%';
    document.getElementById('statKnow').textContent = L.statKnow(scoreKnow);
    document.getElementById('statDont').textContent = L.statDont(scoreDont);
    document.getElementById('resultTitle').textContent = L.results[tier].title;
    document.getElementById('resultMsg').textContent   = L.results[tier].msg;

    setTimeout(() => el.classList.add('show'), 10);
}

/* „Skúsiť znova" vracia na zadanie témy — druhá téma je presne to, čo má
   návštevník po prvej sade chuť skúsiť, a cache to väčšinou nič nestojí. */
function restartDemo() {
    document.getElementById('testScreen').style.display = 'none';
    document.getElementById('resultsScreen').style.display = 'none';
    document.getElementById('topicScreen').style.display = 'block';
    setGenerating(false);
    document.getElementById('topicInput').value = '';
    document.getElementById('topicInput').focus();
}

/* ── SPEECH ── */
/* Zdieľaný `speech.js` — rovnaký výber hlasu aj tempo ako v prihlásenej appke.
   Locale ide z vygenerovanej sady, nie natvrdo — inak by sa slovenský preklad
   čítal anglickým hlasom. */
function speakWord(e) {
    e.stopPropagation();
    const code = (generated && generated.language_from) || PAIRS[currentLang].from;
    LexiSpeech.speak(document.getElementById('wordText').textContent, SPEECH_LOCALE[code] || code);
}
function speakTranslation(e) {
    e.stopPropagation();
    const code = (generated && generated.language_to) || PAIRS[currentLang].to;
    LexiSpeech.speak(document.getElementById('translationText').textContent, SPEECH_LOCALE[code] || code);
}

/* ── TMAVÝ REŽIM ── */
function toggleTheme() {
    const dark = document.documentElement.getAttribute('data-theme') === 'dark';
    if (dark) { document.documentElement.removeAttribute('data-theme'); localStorage.setItem('darkMode', 'false'); }
    else { document.documentElement.setAttribute('data-theme', 'dark'); localStorage.setItem('darkMode', 'true'); }
}

/* ── INIT ── */
document.querySelectorAll('.lang-mini button').forEach(b =>
    b.addEventListener('click', () => setLang(b.getAttribute('data-lang'))));
['themeToggle', 'themeToggleTopic'].forEach(id =>
    document.getElementById(id).addEventListener('click', toggleTheme));
document.getElementById('topicForm').addEventListener('submit', generateSet);

setLang(currentLang);
document.getElementById('topicInput').focus();
</script>
<script src="/static/js/cookie-notice.js?v={{ app_version }}"></script>
</body>
</html>
