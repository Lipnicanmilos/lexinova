<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-en="Repeat vocabulary – LexiNova" data-sk="Opakovanie slovíčok – LexiNova">Opakovanie slovíčok – LexiNova</title>
    {% include "partials/lang_boot.html" %}
    <!-- Appka má vlastný EN/SK prepínač; automatický preklad Chromu ho po načítaní prepisoval (aj popisku tlačidla „EN" na „SK"). -->
    <meta name="google" content="notranslate">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#4079ff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="LexiNova">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <script>(function(){if(localStorage.getItem('darkMode')==='true')document.documentElement.setAttribute('data-theme','dark');})()</script>
    <link rel="stylesheet" href="/static/css/fonts.css?v={{ app_version }}">
    <link rel="stylesheet" href="/static/css/design-system.css?v={{ app_version }}">
    <link rel="stylesheet" href="/static/css/app-shell.css?v={{ app_version }}">

    <link rel="stylesheet" href="/static/css/page-repeat.css?v={{ app_version }}">
    {% include "partials/analytics.html" %}
{% include "partials/app_version.html" %}
</head>
<body>


<!-- ── HEADER ── -->
<header class="header">
    <div class="header-inner">
        <a href="/dashboard" class="logo"><img src="/static/logo.png" alt="" class="logo-mark" style="height:1.35em;width:1.35em;vertical-align:-0.32em;border-radius:5px;margin-right:.2em;">LexiNova</a>
        <div class="header-right">
            <div class="lang-switch">
                <button class="lang-btn" data-lang="en">EN</button>
                <button class="lang-btn" data-lang="sk">SK</button>
            </div>
            <button id="installBtn" class="icon-btn" style="display:none; color:var(--primary);">
                📲 <span data-en="Install" data-sk="Inštalovať">Install</span>
            </button>
            <button onclick="history.back()" class="icon-btn">
                ← <span data-en="Back" data-sk="Späť">Back</span>
            </button>
            <button onclick="logout()" class="icon-btn danger">
                <span data-en="Log out" data-sk="Odhlásiť sa">Log out</span>
            </button>
        </div>
        <button class="menu-toggle" id="menuToggle">☰</button>
    </div>
    <nav class="mobile-nav" id="mobileNav">
        <div class="mobile-lang">
            <button class="lang-btn" data-lang="en">EN</button>
            <button class="lang-btn" data-lang="sk">SK</button>
        </div>
        <button data-pwa-install data-display="flex" style="display:none; color:var(--primary);">📲 <span data-en="Install app" data-sk="Inštalovať appku">Install app</span></button>
        <button onclick="history.back()">← <span data-en="Back" data-sk="Späť">Back</span></button>
        <button onclick="logout()" style="color:var(--danger)"><span data-en="Log out" data-sk="Odhlásiť sa">Log out</span></button>
    </nav>
</header>

<!-- ── MAIN ── -->
<main style="padding: 0 1rem 3rem;">
    <div class="repeat-container">

        <div class="card-header">
            <h1 data-en="Repeat Vocabulary" data-sk="Opakovanie slovíčok">Repeat Vocabulary</h1>
            <div class="card-subtitle" id="categoryInfo" data-en="Loading…" data-sk="Načítavam…">Loading…</div>
        </div>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <div data-en="Loading words…" data-sk="Načítavam slovíčka…">Loading words…</div>
        </div>

        <div id="content" style="display:none;">
            <div class="lang-selector">
                <div>
                    <label for="originalLangSelect" data-en="Word" data-sk="Slovíčko">Slovíčko</label>
                    <select id="originalLangSelect" class="app-select">
                        <option value="en-US">English</option>
                        <option value="sk-SK">Slovenčina</option>
                        <option value="de-DE">Deutsch</option>
                        <option value="fr-FR">Français</option>
                        <option value="es-ES">Español</option>
                    </select>
                </div>
                <div>
                    <label for="translationLangSelect" data-en="Translation" data-sk="Preklad">Preklad</label>
                    <select id="translationLangSelect" class="app-select">
                        <option value="sk-SK">Slovenčina</option>
                        <option value="en-US">English</option>
                        <option value="de-DE">Deutsch</option>
                        <option value="fr-FR">Français</option>
                        <option value="es-ES">Español</option>
                    </select>
                </div>
            </div>

            <details class="play-settings" id="playSettings">
                <summary data-en="⚙ Auto Play settings" data-sk="⚙ Nastavenia prehrávania">⚙ Auto Play settings</summary>
                <div class="play-settings-body">
                    <div>
                        <label for="repeatCountSelect" data-en="Repeat" data-sk="Opakovať">Repeat</label>
                        <select id="repeatCountSelect" class="app-select">
                            <option value="1" data-en="1× word + translation" data-sk="1× slovo + preklad">1× word + translation</option>
                            <option value="2" data-en="2× each" data-sk="2× každé">2× each</option>
                            <option value="3" data-en="3× each" data-sk="3× každé">3× each</option>
                            <option value="sandwich" data-en="Word → translation → word" data-sk="Slovo → preklad → slovo">Word → translation → word</option>
                        </select>
                    </div>
                    <div>
                        <label for="rateSelect" data-en="Speed" data-sk="Rýchlosť">Speed</label>
                        <select id="rateSelect" class="app-select">
                            <option value="0.6" data-en="Very slow" data-sk="Veľmi pomaly">Very slow</option>
                            <option value="0.75" data-en="Slow" data-sk="Pomaly">Slow</option>
                            <option value="0.85" selected data-en="Normal" data-sk="Normálne">Normal</option>
                            <option value="1" data-en="Fast" data-sk="Rýchlo">Fast</option>
                        </select>
                    </div>
                    <div>
                        <label for="gapSelect" data-en="Pause" data-sk="Pauza">Pause</label>
                        <select id="gapSelect" class="app-select">
                            <option value="300">0.3 s</option>
                            <option value="800" selected>0.8 s</option>
                            <option value="1500">1.5 s</option>
                            <option value="2500">2.5 s</option>
                        </select>
                    </div>
                    <div class="play-settings-check">
                        <input type="checkbox" id="shuffleCheck" checked />
                        <label for="shuffleCheck" data-en="Shuffle" data-sk="Náhodné poradie">Shuffle</label>
                    </div>
                    <div class="play-settings-check">
                        <input type="checkbox" id="loopCheck" />
                        <label for="loopCheck" data-en="Loop" data-sk="Dokola">Loop</label>
                    </div>
                </div>
            </details>

            <div class="progress">
                <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
                <div class="progress-text" id="progressText">0 / 0</div>
            </div>

            <div class="flashcard" id="flashcard" onclick="flipCard()">
                <div class="card-content" id="cardContent" data-en="Click to start" data-sk="Klikni pre začatie">Click to start</div>
                <div class="card-label"  id="cardLabel"   data-en="Word"           data-sk="Slovíčko">Word</div>
            </div>

            <div class="controls">
                <button class="btn btn-play"  id="autoPlayBtn" onclick="startAutoPlay()" data-en="▶ Auto Play" data-sk="▶ Automaticky">▶ Auto Play</button>
                <button class="btn btn-secondary" id="pauseBtn" onclick="togglePauseAutoPlay()" style="display:none;" data-en="⏸ Pause" data-sk="⏸ Pauza">⏸ Pause</button>
                <button class="btn btn-stop"  id="stopBtn"     onclick="stopAutoPlay()"  style="display:none;" data-en="⏹ Stop" data-sk="⏹ Zastaviť">⏹ Stop</button>
            </div>
            <div class="controls">
                <button class="btn btn-secondary" id="prevBtn" onclick="previousWord()" data-en="← Previous" data-sk="← Predchádzajúce">← Previous</button>
                <button class="btn btn-secondary" id="nextBtn" onclick="nextWord()"     data-en="Next →"     data-sk="Ďalšie →">Next →</button>
            </div>
        </div>

        <div id="message" class="msg"></div>

        <div class="controls" style="margin-top:1.5rem;">
            <button class="btn btn-secondary" onclick="history.back()" data-en="← Back" data-sk="← Späť">← Back</button>
        </div>
    </div>
</main>

<script src="/static/js/offline-cache.js?v={{ app_version }}"></script>
<script src="/static/js/speech.js?v={{ app_version }}"></script>
<script src="/static/js/page-repeat.js?v={{ app_version }}"></script>
<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').then(reg => {
            if (reg.waiting) reg.waiting.postMessage({type:'SKIP_WAITING'});
            reg.addEventListener('updatefound', () => {
                const sw = reg.installing;
                if (sw) sw.addEventListener('statechange', () => { if(sw.state==='installed') sw.postMessage({type:'SKIP_WAITING'}); });
            });
        }).catch(err => console.error('SW error:',err));
    }
</script>
<script src="/static/js/pwa-install.js?v={{ app_version }}"></script>
<script src="/static/js/site-footer.js?v={{ app_version }}"></script>
<script src="/static/js/cookie-notice.js?v={{ app_version }}"></script>
</body>
</html>
