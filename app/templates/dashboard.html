<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title data-en="Today – LexiNova" data-sk="Dnes – LexiNova">Dnes – LexiNova</title>
    {% include "partials/lang_boot.html" %}
    <!-- Appka má vlastný EN/SK prepínač; automatický preklad Chromu ho po načítaní prepisoval (aj popisku tlačidla „EN" na „SK"). -->
    <meta name="google" content="notranslate">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#4079ff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="LexiNova">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <script>(function(){if(localStorage.getItem('darkMode')==='true')document.documentElement.setAttribute('data-theme','dark');})()</script>
    {% include "partials/head_hints.html" %}
    <link rel="stylesheet" href="/static/css/fonts.css?v={{ app_version }}">
    <link rel="stylesheet" href="/static/css/design-system.css?v={{ app_version }}">
    <link rel="stylesheet" href="/static/css/app-shell.css?v={{ app_version }}">
    <script src="/static/js/offline-cache.js?v={{ app_version }}"></script>
    <link rel="stylesheet" href="/static/css/icons.css?v={{ app_version }}">
    <link rel="stylesheet" href="/static/css/page-dashboard.css?v={{ app_version }}">
    {% include "partials/analytics.html" %}
{% include "partials/app_version.html" %}
</head>
<!-- stats-loading je v HTML, nie až v JS: medzi prvým vykreslením a pageshow
     by inak na okamih svietili prázdne miesta, čo vyzerá ako odpoveď, nie ako čakanie. -->
<body class="has-tabs stats-loading">

{% include "partials/app_bar.html" %}

<!-- Obrazovka má jednu otázku: čo sa dnes učiť. Čísla a graf sú na /statistiky. -->
<main class="container today-page">
    <div class="page-head">
        <h1 data-en="Today" data-sk="Dnes">Dnes</h1>
        <span class="page-head-note" id="streakText"></span>
    </div>

    <section class="hero-card">
        <div class="hero-title" id="todayTitle">&nbsp;</div>
        <p class="hero-meta" id="todayMeta">&nbsp;</p>
        <a class="app-btn primary lg block" id="todayBtn" href="/sady"><span id="todayBtnText">&nbsp;</span></a>
    </section>

    <section class="week-card">
        <div class="week-head">
            <span data-en="This week" data-sk="Tento týždeň">Tento týždeň</span>
            <span class="page-head-note" id="weekCount"></span>
        </div>
        <div class="week-days" id="weekDots"></div>
    </section>
</main>

<script src="/static/js/app-core.js?v={{ app_version }}"></script>
<script src="/static/js/page-dashboard.js?v={{ app_version }}"></script>
<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').then(reg => {
            if (reg.waiting) reg.waiting.postMessage({type:'SKIP_WAITING'});
            reg.addEventListener('updatefound', () => {
                const sw = reg.installing;
                if (sw) sw.addEventListener('statechange', () => { if (sw.state==='installed') sw.postMessage({type:'SKIP_WAITING'}); });
            });
        }).catch(err => console.error('SW error:',err));
    }
</script>
<script src="/static/js/cookie-notice.js?v={{ app_version }}"></script>
</body>
</html>
