<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Login</title>
    {% include "partials/lang_boot.html" %}
    <style>
        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 24px;
            background: white;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s ease;
            width: 100%;
            max-width: 300px;
            margin: 10px 0;
        }
        
        .google-btn:hover {
            background: #f5f5f5;
            border-color: #ccc;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        
        .google-btn img {
            width: 20px;
            height: 20px;
        }
    </style>
</head>
<body>
    <button class="google-btn" onclick="handleGoogleLogin()">
        <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        <span data-en="Continue with Google" data-sk="Pokračovať s Google">Continue with Google</span>
    </button>

    <script>
        function handleGoogleLogin() {
            // Presmerujeme na backend Google OAuth endpoint
            window.location.href = '/auth/google';
        }
        
        // Spracovanie callbacku po návrate z Google
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            const newUser = urlParams.get('new_user');
            
            if (token) {
                // Uložíme token a presmerujeme na dashboard
                localStorage.setItem('access_token', token);
                
                // Ak je to nový používateľ, môžeme zobraziť welcome message
                if (newUser === '1') {
                    localStorage.setItem('show_welcome', 'true');
                }
                
                // Načítame user data
                loadUserDataAndRedirect();
            }
        });
        
        async function loadUserDataAndRedirect() {
            try {
                const token = localStorage.getItem('access_token');
                const response = await fetch('/api/v1/users/me', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (response.ok) {
                    const userData = await response.json();
                    localStorage.setItem('user_email', userData.email);
                    localStorage.setItem('user_name', userData.name);
                    
                    // Presmerujeme na dashboard
                    window.location.href = '/dashboard';
                }
            } catch (error) {
                console.error('Error loading user data:', error);
            }
        }
    </script>
</body>
</html>
